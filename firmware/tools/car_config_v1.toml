# CRS config: the author's in-car configuration
# Format: firmware/docs/specs/Spec - CRS Format.md, section 4.0
#
# Flash to Slot A using:
#   ./embed_with_cfg.sh --toml ./car_config_v1.toml

[toml]
version = 1

[target]
fw_compat_id = "0x20260216"
crs_schema_version = 1

[global]
scan_hz = 1000

pin_pull_default = "up"          # none|up|down
active_low_default = true

debounce_ms_default = 5
long_press_ms_default = 600

# Button emission defaults
pulse_ms_button_default = 50      # 0=tracked-release, else pulsed release in ms
repeat_period_ms_default = 0      # 0=off, else 20..2000

# Encoder rotation defaults
encoder_pulse_ms_default = 30     # press duration per step (must be >0)
encoder_swap_ab_default = false
encoder_detent_guard_ms_default = 2

# LED persistence / boot policy
led_state_persist = true
led_state_on_boot = "restore"    # on|off|restore

led_level_persist = true
led_level_on_boot = 0             # 0=restore, else 1..100
led_level_default = 50            # 1..100
led_level_step = 1                # 1..50
led_level_min = 1                 # 1..100
led_level_max = 50                # 1..100
led_autosave_delay_ms = 1500      # debounce flash commits for runtime LED changes

# --- Panel buttons (IDs 1..6) ---

[[buttons]]
kind = "panel"
id = 2
enabled = true
short_action = { kbd = { mods = 0x00, usage = 0x3A } }  # F1
long_action  = { internal = { id = 0x06 } }  # LED LEVEL (-)
repeat_period_ms = 100 # This is a repeated LONG action

[[buttons]]
kind = "panel"
id = 4
enabled = true
short_action = { kbd = { mods = 0x00, usage = 0x3B } }  # F2
long_action  = { internal = { id = 0x01 } }  # TOGGLE LED

[[buttons]]
kind = "panel"
id = 6
enabled = true
short_action = { kbd = { mods = 0x00, usage = 0x3C } }  # F3
long_action  = { internal = { id = 0x05 } }  # LED LEVEL (+)
repeat_period_ms = 100 # # This is a repeated LONG action

# --- Encoder push buttons (IDs 1..2) ---

[[buttons]]
kind = "encoder"
id = 1
enabled = true
short_action = { cc = { usage = 0x00E2 } }              # Mute
long_action  = { kbd = { mods = 0x00, usage = 0x3E } }  # F5


[[buttons]]
kind = "encoder"
id = 2
enabled = true
short_action = { cc = { usage = 0x00CD } }              # Play/Pause
long_action  = { kbd = { mods = 0x00, usage = 0x40 } }  # F7

# --- Encoders (rotation only, IDs 1..2) ---

[[encoders]]
id = 1
enabled = true
cw_action  = { cc = { usage = 0x00E9 } }              # Vol+
ccw_action = { cc = { usage = 0x00EA } }              # Vol-

[[encoders]]
id = 2
enabled = true
cw_action = { cc = { usage = 0x00B5 } }               # Scan Next Track
ccw_action  = { cc = { usage = 0x00B6 } }             # Scan Previous Track

