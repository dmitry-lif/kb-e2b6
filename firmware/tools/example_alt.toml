# CRS config (alternate example)
# Format: firmware/docs/specs/Spec - CRS Format.md, section 4.0
#
# Flash to Slot A using:
#   ./embed_with_cfg.sh --toml ./example_alt.toml

[toml]
version = 1

[target]
fw_compat_id = "0x20260216"
crs_schema_version = 1

[global]
scan_hz = 1000

pin_pull_default = "up"          # none|up|down
active_low_default = true

debounce_ms_default = 5
long_press_ms_default = 600

# Button emission defaults
pulse_ms_button_default = 50
repeat_period_ms_default = 0

# Encoder rotation defaults
encoder_pulse_ms_default = 30
encoder_swap_ab_default = true
encoder_detent_guard_ms_default = 2

# LED persistence / boot policy
led_state_persist = true
led_state_on_boot = "restore"    # on|off|restore

led_level_persist = true
led_level_on_boot = 0             # 0=restore, else 1..100
led_level_default = 30
led_level_step = 5
led_level_min = 10
led_level_max = 100
led_autosave_delay_ms = 1500

# --- Panel buttons (IDs 1..6) ---

[[buttons]]
kind = "panel"
id = 1
enabled = true
short_action = { kbd = { mods = 0x00, usage = 0x29 } }  # Escape

[[buttons]]
kind = "panel"
id = 2
enabled = true
short_action = { cc = { usage = 0x0040 } }              # Home

[[buttons]]
kind = "panel"
id = 3
enabled = true
short_action = { kbd = { mods = 0x00, usage = 0x76 } }  # Menu

[[buttons]]
kind = "panel"
id = 4
enabled = true
short_action = { cc = { usage = 0x00CD } }              # Play/Pause
long_action  = { cc = { usage = 0x00E2 } }              # Mute

[[buttons]]
kind = "panel"
id = 5
enabled = true
short_action = { cc = { usage = 0x00B5 } }              # Next Track
long_action  = { cc = { usage = 0x00E9 } }              # Vol+
repeat_period_ms = 50

[[buttons]]
kind = "panel"
id = 6
enabled = true
short_action = { cc = { usage = 0x00B6 } }              # Previous Track
long_action  = { cc = { usage = 0x00EA } }              # Vol-
repeat_period_ms = 50

# --- Encoder push buttons (IDs 1..2) ---

[[buttons]]
kind = "encoder"
id = 1
enabled = false
short_action = { none = {} }

[[buttons]]
kind = "encoder"
id = 2
enabled = true
short_action = { internal = { id = 0x01 } }             # Toggle LED/PWM
long_action  = { internal = { id = 0x02 } }             # Level next
repeat_period_ms = 100

# --- Encoders (rotation only, IDs 1..2) ---

[[encoders]]
id = 1
enabled = true
cw_action  = { cc = { usage = 0x00E9 } }                # Vol+
ccw_action = { cc = { usage = 0x00EA } }                # Vol-

[[encoders]]
id = 2
enabled = true
cw_action  = { internal = { id = 0x05 } }               # Level+
ccw_action = { internal = { id = 0x06 } }               # Level-

