# CRS config (sample)
# Format: firmware/docs/specs/Spec - CRS Format.md, section 4.0
#
# Flash to Slot A using:
#   ./embed_with_cfg.sh --toml ./custom_smoke_test.toml

[toml]
version = 1

[target]
fw_compat_id = "0x20260216"
crs_schema_version = 1

[global]
scan_hz = 1000

pin_pull_default = "up"          # none|up|down
active_low_default = true

debounce_ms_default = 5
long_press_ms_default = 500

# Button emission defaults
pulse_ms_button_default = 50
repeat_period_ms_default = 0

# Encoder rotation defaults
encoder_pulse_ms_default = 30
encoder_swap_ab_default = false
encoder_detent_guard_ms_default = 2

# LED persistence / boot policy
led_state_persist = true
led_state_on_boot = "restore"    # on|off|restore

led_level_persist = true
led_level_on_boot = 0             # 0=restore, else 1..100
led_level_default = 30
led_level_step = 5
led_level_min = 10
led_level_max = 100
led_autosave_delay_ms = 250

# --- Buttons (IDs 1..6) ---

[[buttons]]
kind = "panel"
id = 1
enabled = true
short_action = { kbd = { mods = 0x00, usage = 0x16 } }  # S
long_action  = { kbd = { mods = 0x00, usage = 0x0F } }  # L


[[buttons]]
kind = "panel"
id = 2
enabled = true
short_action = { kbd = { mods = 0x00, usage = 0x04 } }  # A
long_action  = { kbd = { mods = 0x00, usage = 0x05 } }  # B

[[buttons]]
kind = "panel"
id = 3
enabled = true
short_action = { kbd = { mods = 0x00, usage = 0x06 } }  # C
long_action  = { kbd = { mods = 0x00, usage = 0x07 } }  # D

[[buttons]]
kind = "panel"
id = 4
enabled = true
short_action = { kbd = { mods = 0x00, usage = 0x08 } }  # E
long_action  = { kbd = { mods = 0x00, usage = 0x09 } }  # F

[[buttons]]
kind = "panel"
id = 5
enabled = true
short_action = { cc = { usage = 0x00CD } }              # Play/Pause
long_action  = { cc = { usage = 0x00E2 } }              # Mute

[[buttons]]
kind = "panel"
id = 6
enabled = true
short_action = { internal = { id = 0x05 } }             # Level+
long_action  = { internal = { id = 0x06 } }             # Level-
repeat_period_ms = 60

# --- Encoders (IDs 1..2) ---

[[encoders]]
id = 1
enabled = true
cw_action  = { internal = { id = 0x05 } }              # Level+
ccw_action = { internal = { id = 0x06 } }              # Level-

[[encoders]]
id = 2
enabled = true
cw_action  = { cc = { usage = 0x00E9 } }                # Vol+
ccw_action = { cc = { usage = 0x00EA } }                # Vol-

# --- Encoder push buttons (IDs 1..2) ---

[[buttons]]
kind = "encoder"
id = 1
enabled = true
short_action = { cc = { usage = 0x00E2 } }              # Mute

[[buttons]]
kind = "encoder"
id = 2
enabled = true
short_action = { kbd = { mods = 0x00, usage = 0x28 } }  # Enter

